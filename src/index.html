<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Control Center</title>
    <!-- PCC Redesign Gate 12 (App Icon & Branding): the favicon is embedded as an inline
         data URI (source: src/icons/favicon.svg) rather than a linked file, keeping
         index.html fully self-contained per this project's "one dependency-free file"
         architecture. apple-touch-icon and the PWA manifest icons can't be inlined the
         same way (manifest.json is inherently its own file per spec, and Apple's install
         flow wants a real image URL) — those live in icons/ and manifest.json at the repo
         root, shipped alongside index.html. Regenerate the PNGs with
         `node generate-icons.js` after editing the source SVG. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iI2ZmZmZmZiIgLz4KICA8cG9seWdvbiBwb2ludHM9IjUsMjQgMTEsMjQgMTEsMTgiIGZpbGw9IiMwZTlhYTciIC8+CiAgPHJlY3QgeD0iMTMiIHk9IjEyIiB3aWR0aD0iNiIgaGVpZ2h0PSIxMiIgcng9IjEiIGZpbGw9IiMzZDYzZGQiIC8+CiAgPHJlY3QgeD0iMjEiIHk9IjYiIHdpZHRoPSI2IiBoZWlnaHQ9IjE4IiByeD0iMSIgZmlsbD0iIzE0MjAzYSIgLz4KPC9zdmc+Cg==" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#3d63dd" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Loading screen: this app is one large inlined file (embedded fonts, vendored
         libraries, the full React bundle) — layout.js's own boot sequence does
         `root.innerHTML = ""` then rebuilds the real shell (see layout.js), which wipes
         this out automatically the instant the app is actually ready. No JS of its own,
         no removal step to maintain — it only ever exists in the gap between initial
         paint and boot, which is exactly what it's for. Colors are hardcoded rather than
         reading the --bg-default/--text-primary tokens' light-theme values, since this
         has to render correctly before any script (including the theme toggle) has run;
         data-theme="dark" above is this app's own hardcoded default for the same reason. -->
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background-color: #0e1015; color: #edeef2; font-family: ui-sans-serif, sans-serif;">
        <div class="spinner" style="width: 28px; height: 28px; border-width: 3px;"></div>
        <div style="font-size: 13px; letter-spacing: 0.4px; opacity: 0.7;">Project Control Center</div>
      </div>
    </div>

    <!-- Classic scripts on purpose: type="module" is blocked by browsers under
         file:// (CORS restriction on module loading), which would break
         double-click-to-open. Load order matters. -->
    <script src="js/vendor/xlsx.core.min.js"></script>
    <script src="js/vendor/mammoth.browser.min.js"></script>

  </body>
</html>
