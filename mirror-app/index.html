      (loaded.schedules || []).forEach(function (s) {
        if (s.calendar_aware === undefined) s.calendar_aware = false;
      });
      loaded.schema_version = 62;
    }

    if (loaded.schema_version < 63) {
      // Architecture Upgrade Phase 7 (Advanced Scheduling, follow-on): constraints_enabled
      // defaults to false for every existing schedule — see newSchedule()'s own comment.
      (loaded.schedules || []).forEach(function (s) {
        if (s.constraints_enabled === undefined) s.constraints_enabled = false;
      });
      loaded.schema_version = 63;
    }

    if (loaded.schema_version < 64) {
      // Auto Baseline Delay Detection + Bidirectional Delay Comments: every existing
      // delay_records row backfilled with auto_generated:false (a record from before
      // this feature existed was, by definition, entered by hand — see newDelayRecord()'s
      // own comment) and comments:[] (see newDelayRecord()'s own comment on why this is
      // a single shared array, not split per view).
      (loaded.delay_records || []).forEach(function (r) {
        if (r.auto_generated === undefined) r.auto_generated = false;
        if (r.comments === undefined) r.comments = [];
      });
      loaded.schema_version = 64;
    }

    if (loaded.schema_version < 65) {
      // One-way hourly data mirror (Windows -> Android, read-only): two new settings,
      // both default to a fully-off state so no existing install starts silently writing
      // files anywhere without the user explicitly opting in and choosing a folder.
      if (loaded.settings) {
        if (loaded.settings.sync_mirror_enabled === undefined) loaded.settings.sync_mirror_enabled = false;
        if (loaded.settings.sync_mirror_folder_path === undefined) loaded.settings.sync_mirror_folder_path = "";
      }
      loaded.schema_version = 65;
    }

    return loaded;
  }

  var data = null;
  var listeners = [];
  var persistListeners = [];
  var saveTimer = null;
  var corruptionRecovery = null; // { key, timestamp } set once, only if load() hits unparseable JSON

  var CORRUPTED_BACKUP_PREFIX = "pcc_corrupted_backup_";

  function notifyListeners() {
    listeners.forEach(function (fn) {
      try {
        fn(data);
      } catch (e) {
        console.error("PCC store listener error", e);
      }
    });
  }

  // Bug fix (Daily-Use Audit, Phase 1): separate from notifyListeners() above, which
  // fires synchronously the instant data changes — layout.js used to update the
  // footer's "SAVED · <time>" label straight off that signal, so it could claim data
  // was saved up to 250ms before persistToLocalStorage() (debounced below) actually
  // ran. This fires only once the real write has been attempted, so a listener can
  // show an accurate "Saving…" -> "SAVED" transition instead.
  function notifyPersistListeners(ok) {
    persistListeners.forEach(function (fn) {
      try {
        fn(data, ok);
      } catch (e) {
        console.error("PCC store onPersisted listener error", e);
      }
    });
  }

  function persistToLocalStorage() {
    var ok = true;
    try {
      window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
      data.meta.last_saved_at = new Date().toISOString();
    } catch (e) {
      ok = false;
      console.error("Could not save to browser storage", e);
      if (window.PCC.notify) {
        window.PCC.notify(
          "Could not autosave to this browser (storage may be full or blocked). Export your data now to be safe.",
          "error"
        );
      }
    }
    notifyPersistListeners(ok);
  }

  function scheduleSave() {
    notifyListeners();
    if (saveTimer) window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(persistToLocalStorage, 250);
  }

  function load() {
    var raw = null;
    try {
      raw = window.localStorage.getItem(LOCAL_STORAGE_KEY);
    } catch (e) {
      console.error("Could not read browser storage", e);
    }
    if (raw) {
      try {
        data = migrate(JSON.parse(raw));
        return;
      } catch (e) {
        console.error("Stored data was corrupted, starting fresh.", e);
        // Preserve the raw unparseable string under its own key immediately, before
        // anything else touches storage, so it survives regardless of what the person
        // does next (including if they never see or dismiss the recovery banner). Kept
        // separate from LOCAL_STORAGE_KEY so a future normal save can never overwrite it.
        try {
          var recoveryKey = CORRUPTED_BACKUP_PREFIX + Date.now();
          window.localStorage.setItem(recoveryKey, raw);
          corruptionRecovery = { key: recoveryKey, timestamp: new Date().toISOString() };
        } catch (e2) {
          console.error("Could not preserve corrupted backup separately", e2);
          corruptionRecovery = { key: null, timestamp: new Date().toISOString() };
        }
      }
    }
    data = emptyData();
  }

  function get() {
    return data;
  }

  function onChange(fn) {
    listeners.push(fn);
  }

  /** See notifyPersistListeners()'s own comment — fires once the debounced write has
   * actually been attempted, not the instant data changes. fn receives (data, ok). */
  function onPersisted(fn) {
    persistListeners.push(fn);
  }

  /** Mutate data via a callback, then autosave + notify. */
  function update(mutator) {
    mutator(data);
    scheduleSave();
  }

  /** Daily-Use Audit Phase 3 (field memory) — see settings.last_used_names' own comment
   * in emptyData(). key is a short per-field id chosen by the calling page module (e.g.
   * "rfi_raised_by"), not a schema field name, so unrelated registers never collide. */
  function getLastUsedName(key) {
    return (data.settings.last_used_names && data.settings.last_used_names[key]) || "";
  }

  function rememberLastUsedName(key, value) {
    if (!value || !value.trim()) return;
    update(function (d) {
      d.settings.last_used_names = d.settings.last_used_names || {};
      d.settings.last_used_names[key] = value.trim();
    });
  }

  /** Every place a binary blob can currently live: Documents' `file_data`, and each
   * Daily Log entry's `photos[].file_data`. Returns get/set accessors rather than raw
   * values so callers can read AND write back into the same object graph \u2014 used by
   * export (read), import (write), and the one-time legacy-blob migration (both). */
  function collectBlobRefs(d) {
    var refs = [];
    (d.documents || []).forEach(function (doc) {
      refs.push({
        id: doc.id,
        get: function () {
          return doc.file_data;
        },
        set: function (v) {
          doc.file_data = v;
        },
      });
    });
    (d.daily_logs || []).forEach(function (log) {
      (log.photos || []).forEach(function (photo) {
        refs.push({
          id: photo.id,
          get: function () {
            return photo.file_data;
          },
          set: function (v) {
            photo.file_data = v;
          },
        });
      });
    });
    return refs;
  }

  /** One-time migration for data saved before blobs moved to IndexedDB: finds any
   * document/photo still carrying its file bytes inline in `file_data`, writes each to
   * IndexedDB, and nulls the field once that write succeeds \u2014 shrinking what
   * persistToLocalStorage() has to write from then on. Mutates the live `data` object
   * directly and persists when done, unlike exportToFile()'s deep-clone approach, since
   * this genuinely IS the migration of the live data, not a one-off snapshot of it.
   * Safe to call on data with nothing to migrate (resolves immediately, no-op). */
  function migrateLegacyInlineBlobsToIndexedDb() {
    var refs = collectBlobRefs(data).filter(function (r) {
      return !!r.get();
    });
    if (refs.length === 0) return Promise.resolve({ migrated: 0 });
    var writes = refs.map(function (r) {
      var val = r.get();
      return window.PCC.blobStore.putBlob(r.id, val).then(function () {
        r.set(null);
      });
    });
    return Promise.all(writes).then(function () {
      persistToLocalStorage();
      notifyListeners();
      return { migrated: refs.length };
    });
  }

  /** Async: gathers every blob (from IndexedDB, or inline for any not-yet-migrated
   * legacy record) into a deep-cloned copy of `data` and downloads that as the export
   * file \u2014 so the exported JSON stays fully self-contained and portable, same as
   * before this migration, even though the live in-memory/localStorage copy no longer
   * carries blobs inline. Never mutates the live `data`; persistToLocalStorage() at the
   * end still persists the original blob-free object. */
  /** Builds the same fully-resolved (blobs inlined) export JSON string exportToFile() and
   * the data mirror (src/js/dataMirror.js) both need, without exportToFile()'s own
   * save-dialog/download side effect — the one thing that differs between "download a
   * copy" and "silently write a mirror snapshot." Does not touch last_exported_at or
   * persist/notify; exportToFile() below still owns those, since they're specifically
   * about a user-initiated export, not every mirror write. */
  function buildExportJson() {
    var clone = JSON.parse(JSON.stringify(data));
    var refs = collectBlobRefs(clone).filter(function (r) {
      return !r.get();
    });
    var fetches = refs.map(function (r) {
      return window.PCC.blobStore
        .getBlob(r.id)
        .then(function (val) {
          r.set(val);
        })
        .catch(function () {
          r.set(null); // missing one photo shouldn't block the whole export
        });
    });
    return Promise.all(fetches).then(function () {
      return JSON.stringify(clone, null, 2);
    });
  }

  function exportToFile() {
    data.meta.last_exported_at = new Date().toISOString();
    return buildExportJson().then(function (json) {
      var blob = new Blob([json], { type: "application/json" });
      var stamp = new Date().toISOString().slice(0, 10);
      return window.PCC.nativeFile.save(blob, "project-data-" + stamp + ".json").then(function () {
        persistToLocalStorage();
        notifyListeners();
      });
    });
  }

  function getCorruptionRecovery() {
    return corruptionRecovery;
  }

  /** Lists any preserved corrupted-backup snapshots left in localStorage, newest first.
   * These accumulate — one per corruption event — and are only ever removed by explicit
   * user action via deleteRecoveryBackup(), never automatically, since silently pruning
   * a person's last copy of lost data would defeat the entire point of this. */
  function listRecoveryBackups() {
    var keys = [];
    try {
      for (var i = 0; i < window.localStorage.length; i++) {
        var k = window.localStorage.key(i);

      console.error("Could not list recovery backups", e);
    }
    return keys.sort().reverse();
  }

  function downloadRecoveryBackup(key) {
    var raw;
    try {
      raw = window.localStorage.getItem(key);
    } catch (e) {
      raw = null;
    }
    if (raw === null || raw === undefined) return false;
    var blob = new Blob([raw], { type: "text/plain" });
    window.PCC.nativeFile.save(blob, key + ".txt");
    return true;
  }

    try {
      window.localStorage.removeItem(key);
    } catch (e) {
      console.error("Could not delete recovery backup", e);
    }
  }

  /** Shared commit tail for both importFromFile() and importFromSqliteBackup(): `migrated`
   * still carries any resolved blobs inline (as JSON import always has, and as the SQLite
   * Full Backup restore path re-inlines from its files/ folder before calling this), so
   * each one gets written to IndexedDB and nulled out of the record before it's committed
   * to `data` \u2014 otherwise import would re-inflate localStorage right back to the size
   * problem this whole migration exists to fix. */
  function writeInlineBlobsAndCommit(migrated, callback) {
    var refs = collectBlobRefs(migrated).filter(function (r) {
      return !!r.get();
    });
    var writes = refs.map(function (r) {
      var val = r.get();
      return window.PCC.blobStore.putBlob(r.id, val).then(function () {
        r.set(null);
      });
    });

    Promise.all(writes)
      .then(function () {
        data = migrated;
        persistToLocalStorage();
        notifyListeners();
        callback(null);

      .catch(function (e) {
        callback(new Error("Import partially failed while saving attached files: " + e.message));

  /** Shared by importFromFile() below and the data mirror's read side
   * (src/js/dataMirror.js, which reads a mirror snapshot as a plain string via
   * Capacitor's Filesystem API — no File object, so no FileReader involved). */
  function importFromJsonString(jsonText, callback) {

      parsed = JSON.parse(jsonText);

      }
    } catch (e) {
      callback(e);
      return;
    }

    var migrated;
    try {
      migrated = migrate(parsed);
    } catch (e) {
      callback(e);
      return;
    }

  /** Callback-based, same public shape as before. Internally: an imported file still
   * carries blobs inline (exportToFile() always embeds them for portability), so
   * writeInlineBlobsAndCommit() writes each one to IndexedDB and nulls it out of the

  /** Restore path for the PCC Architecture Upgrade's "Full Backup (SQLite)" feature
   * (src/js/sqliteBackupService.js): `parsedData` is sqliteMigrationEngine.exportToJson()'s
   * output \u2014 the full store.js shape, but with every document/daily-log-photo's
   * `file_data` still null (buildDatabase() never puts binary content in the SQLite
   * database itself \u2014 see that file's own header on why). `filesById` is
   * `{id: data URI string}` for every blob the backup's own files/ folder actually
   * contained (a blob unresolvable at backup time is simply absent here, same tolerance
   * archive.js's own export already has for a missing file). This re-inlines each
   * available file onto its record, then commits through the exact same
   * migrate()-then-write-blobs path importFromFile() uses \u2014 a SQLite Full Backup restore
   * is not a second, less-proven code path, it rejoins the existing one. */
  function importFromSqliteBackup(parsedData, filesById, callback) {
    if (!parsedData || typeof parsedData !== "object" || !("schema_version" in parsedData)) {
      callback(new Error("This doesn't look like a Project Control Center SQLite backup."));
      return;
    }

    var migrated;
    try {
      migrated = migrate(parsedData);
    } catch (e) {
      callback(e);
      return;
    }

    var restoredFileCount = 0;
    collectBlobRefs(migrated).forEach(function (r) {
      if (!r.get() && filesById[r.id]) {
        r.set(filesById[r.id]);
        restoredFileCount++;
      }
    });

    writeInlineBlobsAndCommit(migrated, function (err) {
      callback(err, err ? null : { restoredFileCount: restoredFileCount });
    });
  }

  function resetAll() {
    data = emptyData();
    persistToLocalStorage();
    notifyListeners();
  }

  load();

  window.PCC.store = {
    get: get,
    update: update,
    // Exposed for the "At a Glance" mirror app's read-only shim, which needs the exact
    // same schema migration chain a mirror JSON export goes through here, without pulling
    // in importFromJsonString's blobStore-writing side effect (that function is designed
    // to MOVE blobs out of the JSON into IndexedDB, the opposite of what a stateless
    // read-only viewer wants — it just needs the migrated object with blobs still inline).
    migrate: migrate,
    onChange: onChange,
    onPersisted: onPersisted,
    getLastUsedName: getLastUsedName,
    rememberLastUsedName: rememberLastUsedName,
    exportToFile: exportToFile,
    buildExportJson: buildExportJson,
    migrateLegacyInlineBlobsToIndexedDb: migrateLegacyInlineBlobsToIndexedDb,
    getCorruptionRecovery: getCorruptionRecovery,
    listRecoveryBackups: listRecoveryBackups,
    downloadRecoveryBackup: downloadRecoveryBackup,
    deleteRecoveryBackup: deleteRecoveryBackup,
    importFromFile: importFromFile,
    importFromJsonString: importFromJsonString,
    importFromSqliteBackup: importFromSqliteBackup,
    resetAll: resetAll,
    newProject: newProject,
    PROJECT_STATUSES: PROJECT_STATUSES,
    newCompany: newCompany,
    newClient: newClient,
    newDocument: newDocument,
    DOCUMENT_CATEGORIES: DOCUMENT_CATEGORIES,
    DOCUMENT_STATUSES: DOCUMENT_STATUSES,
    newDailyLog: newDailyLog,
    newDailyLogPhoto: newDailyLogPhoto,
    newRisk: newRisk,
    newMeeting: newMeeting,
    newMeetingAction: newMeetingAction,
    newMeetingRecording: newMeetingRecording,
    RISK_TYPES: RISK_TYPES,
    RISK_STATUSES: RISK_STATUSES,
    RISK_LEVELS: RISK_LEVELS,
    newRfi: newRfi,
    newRfiRevision: newRfiRevision,
    nextRfiNumber: nextRfiNumber,
    RFI_TYPES: RFI_TYPES,
    RFI_STATUSES: RFI_STATUSES,
    RFI_PRIORITIES: RFI_PRIORITIES,
    newChangeOrder: newChangeOrder,
    newChangeOrderRevision: newChangeOrderRevision,
    nextChangeOrderNumber: nextChangeOrderNumber,
    CHANGE_ORDER_STATUSES: CHANGE_ORDER_STATUSES,
    newDecision: newDecision,
    DECISION_STATUSES: DECISION_STATUSES,
    WAITING_ON_PARTIES: WAITING_ON_PARTIES,
    newSchedule: newSchedule,
    newWbsItem: newWbsItem,
    newActivity: newActivity,
    newRelationship: newRelationship,
    newCalendar: newCalendar,
    newScheduleBaseline: newScheduleBaseline,
    newRecoveryAction: newRecoveryAction,

    MITIGATION_TYPES: MITIGATION_TYPES,

/* Global Project Context — Redesign Gate 6.
 *
 * Before this gate, every project-scoped page module kept its own independent, module-
 * local `uiState.projectId`/`uiState.projectFilter`, with no shared state between them:
 * picking a project in Schedule had no effect on Executive Center, Risk Register, Cost
 * Tracking, etc. This module is the single shared source of truth for "which project is
 * the user currently working in" — backed by `settings.active_project_id` (schema v54)
 * so it also persists across reloads, same as theme/density/sidebar_collapsed.
 *
 * Deliberately just two functions, no pub/sub of its own: `store.update()` already
 * synchronously notifies every `store.onChange()` listener (see store.js's
 * scheduleSave()), and layout.js's own onChange listener (registered in mount()) is
 * where the shell header's project indicator refreshes — so any caller of set() below,
 * whether the shell switcher or a page's own filter, keeps the header in sync for free.
 * A caller changing the CURRENT page's own project selection already re-renders itself
 * via its own local rerender(); only the shell-level switcher needs to explicitly call
 * router.render() after set() to refresh the page underneath it.
 */
(function () {
  "use strict";
  window.PCC = window.PCC || {};

  function activeProjects(data) {
    return data.projects.filter(function (p) {
      return !p.archived;
    });
  }

  /** Company/Client/Project Management redesign. Same "active only, re-validate on every
   * read" treatment activeProjects() above already gives projects — see CLAUDE.md's spec,
   * point 11 (Active vs Historical). Archived companies/clients still exist and stay fully
   * intact/searchable everywhere else in the app; they just drop out of these three
   * cascading pickers. */
  function activeCompanies(data) {
    return (data.companies || []).filter(function (c) {
      return !c.archived;
    });
  }

  function clientsForCompany(data, companyId) {
    return (data.clients || []).filter(function (c) {
      return !c.archived && c.company_id === companyId;
    });
  }

  function projectsForCompanyClient(data, companyId, clientId) {
    return activeProjects(data).filter(function (p) {
      return p.company_id === companyId && p.client_id === clientId;
    });
  }

  /** Returns the current active company id, or "" if none is set or it no longer points
   * at a live (non-archived) company. */
  function getCompany() {
    var data = window.PCC.store.get();
    var id = data.settings.active_company_id;
    if (!id) return "";
    return activeCompanies(data).some(function (c) {
      return c.id === id;
    })
      ? id
      : "";
  }

  /** Returns the current active client id — "" if none is set, if it's archived, or if it
   * doesn't belong to the current active company (a stale id left over from before the
   * company was switched some other way). */
  function getClient() {
    var data = window.PCC.store.get();
    var companyId = getCompany();
    var id = data.settings.active_client_id;
    if (!id || !companyId) return "";
    return clientsForCompany(data, companyId).some(function (c) {
      return c.id === id;
    })
      ? id
      : "";
  }

  /** Records the last Client + Project used under a given Company, so switching back to
   * that Company later (see setCompany() below) restores where the user left off — spec
   * point 9, "Remember Last Context." Internal; page modules never call this directly. */
  function rememberCompanyContext(data, companyId, clientId, projectId) {
    if (!companyId) return;
    if (!data.settings.company_context_memory) data.settings.company_context_memory = {};
    data.settings.company_context_memory[companyId] = { client_id: clientId || "", project_id: projectId || "" };
  }

  /** Switches the active Company. Per spec point 7, this must NOT arbitrarily pick a
   * Client when the company has several — it only restores a previously-remembered
   * Client+Project for this company (point 9) if one still exists and is still valid;
   * otherwise Client/Project both clear to "unselected" and the cascading selects show
   * their own "choose one" state. */
  function setCompany(companyId) {
    window.PCC.store.update(function (data) {
      data.settings.active_company_id = companyId || "";
      if (!companyId) {
        data.settings.active_client_id = "";
        data.settings.active_project_id = "";
        return;
      }
      var mem = (data.settings.company_context_memory || {})[companyId];
      var restoredClientId = "";
      var restoredProjectId = "";
      if (mem && mem.client_id && clientsForCompany(data, companyId).some(function (c) { return c.id === mem.client_id; })) {
        restoredClientId = mem.client_id;
        if (mem.project_id && projectsForCompanyClient(data, companyId, restoredClientId).some(function (p) { return p.id === mem.project_id; })) {
          restoredProjectId = mem.project_id;
        }

      data.settings.active_client_id = restoredClientId;
      data.settings.active_project_id = restoredProjectId;
    });
  }

  /** Switches the active Client (and, defensively, the Company it belongs to — a Client
   * is exclusive to one Company, so picking a Client always implies its Company). Restores
   * a remembered Project for this exact Company+Client pair if one still exists, per the
   * same "remember last context" rule setCompany() follows for Clients. */
  function setClient(clientId) {
    window.PCC.store.update(function (data) {
      var client = (data.clients || []).find(function (c) {
        return c.id === clientId;
      });
      var companyId = client ? client.company_id : "";
      data.settings.active_company_id = companyId;
      data.settings.active_client_id = clientId || "";
      var restoredProjectId = "";

        var mem = (data.settings.company_context_memory || {})[companyId];
        if (mem && mem.client_id === clientId && mem.project_id && projectsForCompanyClient(data, companyId, clientId).some(function (p) { return p.id === mem.project_id; })) {

        }

      if (companyId) rememberCompanyContext(data, companyId, clientId, restoredProjectId);

   * longer points at a live (non-archived) project — e.g. the project was archived or
   * deleted since it was picked. Never throws, never auto-picks a fallback project;
   * callers that need "some project, any project" (the existing Pattern-A pages) keep
   * their own "first active project" fallback for when this returns "". */
  function get() {
    var data = window.PCC.store.get();
    var id = data.settings.active_project_id;
    if (!id) return "";
    return activeProjects(data).some(function (p) {
      return p.id === id;
    })
      ? id
      : "";
  }

  /** Sets the active project ("" clears it, meaning "All Projects"). Does not validate
   * the id against the project list — callers already only ever pass a value taken from
   * a project `<select>` they just built off `data.projects`, so it's always valid at
   * the moment of the call; get() re-validates on every read regardless (see above), so
   * a project archived later is handled there, not here. */
  /** Sets the active project ("" clears it, meaning "All Projects" within whatever
   * Company/Client is currently active — clearing the project does NOT clear Company/
   * Client, since those still describe the scope being browsed). Company/Client/Project

   * active_client_id to that project's own company_id/client_id and remembers this as the
   * project's company's last-used context (spec point 10 — Project is the context's leaf,
   * so picking one anywhere, including every existing page's own project picker, carries
   * its Company/Client along automatically without those ~30 call sites needing to know
   * Company/Client exist at all). */
  function set(projectId) {
    window.PCC.store.update(function (data) {
      data.settings.active_project_id = projectId || "";
      if (!projectId) return;
      var p = data.projects.find(function (x) {
        return x.id === projectId;
      });
      if (!p) return;
      data.settings.active_company_id = p.company_id || "";
      data.settings.active_client_id = p.client_id || "";
      if (p.company_id) rememberCompanyContext(data, p.company_id, p.client_id, projectId);
    });
  }

  /** Daily-Use Audit Phase 5 (pinned projects): "someone bouncing between a few
   * 'current' projects re-picks from the full, unsorted list every time" — get()/set()
   * above only ever track ONE current project; this is a separate, ordered set of
   * "the 2-3 I actually work in", surfaced first in the shell header's project select
   * (layout.js's populateProjectContextSelect()). Filtered to still-live, non-archived
   * projects on every read, same "re-validate, don't trust a stale id" rule get() above
   * already follows — a pinned project that's since been archived/deleted just quietly
   * drops off rather than leaving a broken entry an unpin action would be needed for. */
  function getPinnedIds() {
    var data = window.PCC.store.get();
    var live = activeProjects(data);
    return (data.settings.pinned_project_ids || []).filter(function (id) {
      return live.some(function (p) {
        return p.id === id;
      });
    });
  }

  function isPinned(projectId) {
    return getPinnedIds().indexOf(projectId) !== -1;
  }

  /** Newly-pinned projects go to the front — the most recently pinned is the one most
   * likely to be what someone's actively switching into right now. */
  function togglePin(projectId) {
    window.PCC.store.update(function (data) {
      if (!data.settings.pinned_project_ids) data.settings.pinned_project_ids = [];
      var idx = data.settings.pinned_project_ids.indexOf(projectId);
      if (idx !== -1) data.settings.pinned_project_ids.splice(idx, 1);
      else data.settings.pinned_project_ids.unshift(projectId);
    });
  }

  window.PCC.projectContext = {
    get: get,
    set: set,
    getPinnedIds: getPinnedIds,
    isPinned: isPinned,
    togglePin: togglePin,
    getCompany: getCompany,
    getClient: getClient,
    setCompany: setCompany,
    setClient: setClient,
    activeCompanies: activeCompanies,
    clientsForCompany: clientsForCompany,
    projectsForCompanyClient: projectsForCompanyClient,
  };
})();
