/* ===== Design tokens =====
   UI/UX overhaul, Gate 1 (Design System). This file only — no page (src/js/pages/*.js)
   or shell (layout.js/router.js) changes in this gate. Responsive breakpoint tiers below
   are documented as the target scheme for Gates 2/8 (nav + tablet/mobile behavior); CSS
   custom properties can't be read inside @media conditions, so the values are plain
   literals kept consistent with this comment, not variables:
     Large Desktop >= 1600px | Desktop 1280-1599px (this stylesheet's unmedia-queried
     baseline) | Laptop 1024-1279px | Tablet 768-1023px | Mobile < 768px (existing
     780/480/420px rules further down predate this scheme and are untouched this gate —
     Gate 2/8 own re-pointing sidebar/nav behavior at these exact tiers). */
:root {
  --font-display: "Space Grotesk", ui-sans-serif, sans-serif;
  --font-body: "Inter", ui-sans-serif, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;

  /* PCC Redesign Gate 1 (Visual Language Foundation): replaces the amber/blueprint-navy
     industrial palette with a modern professional accent + neutral slate backgrounds — see
     PCC-REDESIGN.md (or the session that added this comment) for the full gate plan this is
     part of. --signal-amber keeps its original name deliberately (many call sites reference
     it by name, including a test that asserts the reference itself, not its value) even
     though the color is now blue, not amber — a rename is a separate, later, wider-blast-
     radius change, not bundled into this token-value-only gate. */
  --signal-amber: #3d63dd;
  --signal-amber-dark: #2f4fb8;
  --status-on-track: #1f9d6c;
  --status-at-risk: #d69e2e;
  --status-warning: #dd6b20;
  --status-critical: #e53e3e;
  --status-info: #0e9aa7;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --sidebar-width: 236px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 40px;
  --space-8: 48px;

  /* Typography scale — additive groundwork. Existing pages carry their own hardcoded
     px sizes throughout (13px/13.5px/14px/...); these tokens exist for gradual adoption
     as each page/module gets touched in a later gate, not a forced rename now. */
  --text-xs: 11px;
  --text-sm: 12.5px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;

  --transition-fast: 120ms ease;
  --transition-base: 180ms ease;

  /* Status-badge icons (Lucide, ISC license, vendored as inline SVG data URIs — no
     runtime package, matches how every other icon in this app ships). Applied via
     mask-image on .status-badge::before so every existing call site (63 across 18 files)
     picks these up automatically with zero JSX changes — see .status-badge--* below.

  --icon-status-info: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22/%3E%3Cpath%20d%3D%22M12%2016v-4%22/%3E%3Cpath%20d%3D%22M12%208h.01%22/%3E%3C/svg%3E");

  /* Generic "nothing here yet" icon for .empty-state — one icon, applied uniformly via CSS
     across all ~30 .panel.empty-state call sites app-wide (Portfolio, Schedule, Documents,
     every register), zero JSX changes needed. A single shared icon rather than a bespoke
     one per page: these panels' own text already says exactly what's missing (real content,
     not "nothing here"); the icon softens what's otherwise a wall of centered text; picking
     30 individually "right" icons only that one page would ever see isn't worth the many
     call sites it would need. */
  --icon-empty-state: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%2222%2012%2016%2012%2014%2015%2010%2015%208%2012%202%2012%22/%3E%3Cpath%20d%3D%22M5.45%205.11%202%2012v6a2%202%200%200%200%202%202h16a2%202%200%200%200%202-2v-6l-3.45-6.89A2%202%200%200%200%2016.76%204H7.24a2%202%200%200%200-1.79%201.11z%22/%3E%3C/svg%3E");

}

html[data-theme="dark"] {
  /* Neutral slate, not navy — the old #0b1420/#101b2b/#16243a family read as "blueprint,"
     which this gate is deliberately moving away from. */
  --bg-default: #0e1015;
  --bg-paper: #15171e;
  --bg-paper-raised: #1d2029;
  --text-primary: #edeef2;
  --text-secondary: #9ba1af;
  --divider: rgba(155, 161, 175, 0.14);
  --hover-bg: rgba(155, 161, 175, 0.08);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.34);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.42);

  /* GATE 1 UI/UX audit finding (2026-09-04): axe's color-contrast rule flagged
     .status-badge--on_track and --info as real violations (confirmed, not just
     "incomplete") once tested with actual seeded data — every .status-badge--* variant
     uses its bare --status-* token as text color directly against a 15%-opacity tint of
     that SAME color, so text and background sit close together on the same hue. Measured
     against a real .panel background (#15171e), all but --at_risk landed under the 4.5:1
     AA minimum for normal-size text (3.78-4.40:1). Fix: theme-aware, slightly brighter
     "badge text" variants used ONLY by .status-badge--* — the base --status-* tokens
     (icons, chart legends, KPI figures, everything else that reads them) are untouched,
     since those contexts don't have this same tinted-background problem. Values are the
     minimum lightness shift off the base hue needed to clear 4.5:1 against the badge's own
     background blend — not a palette redesign. */
  --status-badge-on-track-text: #21a672;
  --status-badge-at-risk-text: var(--status-at-risk);
  --status-badge-warning-text: #df6e23;
  --status-badge-critical-text: #ea6262;
  --status-badge-info-text: #0e9eac;

  /* Same audit, same root cause — the Risk Register heat map's severity cells (Gate 2's
     own writeup already flagged these three as sharing the badges' un-tokenized hardcoded-
     rgba() pattern). --low/--medium reuse the badge text tokens above (already clear 4.5:1
     against the heat map's own slightly higher tint alphas); --high needs its own value
     since its 0.22 alpha (vs badges' 0.15) pushes the badge critical shade back under 4.5:1. */
  --heatmap-high-text: #ea6666;
}

html[data-theme="light"] {
  --bg-default: #f4f5f7;
  --bg-paper: #ffffff;
  --bg-paper-raised: #f7f8fa;
  --text-primary: #1a1d29;
  --text-secondary: #5b6272;
  --divider: rgba(26, 29, 41, 0.09);
  --hover-bg: rgba(26, 29, 41, 0.045);
  --shadow-sm: 0 1px 2px rgba(20, 24, 38, 0.06);
  --shadow-md: 0 8px 24px rgba(20, 24, 38, 0.1);
  --shadow-lg: 0 16px 48px rgba(20, 24, 38, 0.16);

  /* Same GATE 1 fix as the dark theme block above, but light theme needed a much bigger
     shift: the same 15%-tint badge backgrounds sit near-white here, so all five statuses
     measured well under 4.5:1 (2.12-3.36:1) — --at_risk included, unlike dark theme. */
  --status-badge-on-track-text: #17724f;
  --status-badge-at-risk-text: #84611a;
  --status-badge-warning-text: #a34f18;
  --status-badge-critical-text: #c61b1b;
  --status-badge-info-text: #0a737d;

  --heatmap-high-text: #bd1919;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-default);
  color: var(--text-primary);
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 600;
  margin: 0;
}

a {
  color: inherit;
}

button {
  font-family: var(--font-body);
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-thumb {
  background: rgba(124, 152, 184, 0.35);
  border-radius: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}

/* ===== App shell ===== */
#app-shell {
  display: flex;
  min-height: 100vh;
}

/* Redesign Gate 4: a real persistent sidebar again — reverses UI/UX Overhaul Gate 2's
   revision (below), which replaced it with the hidden hamburger-overlay .drawer--left at
   Aditya's own explicit request at the time. That contradiction with a standing prior
   decision was flagged directly during this redesign's Phase A inspection rather than
   picked silently, and resolved by Aditya's own explicit "start gate 4" call. Only
   visible at >=1023px (media query below); the hamburger + .drawer--left overlay stays
   completely unchanged below that, per the redesign brief's own instruction not to just
   shrink the desktop sidebar for mobile. Built once in layout.js's mount(), never torn
   down — unlike the overlay, which still rebuilds fresh every time it opens. */
.sidebar {
  display: flex;
  flex-direction: column;
  width: var(--sidebar-width);
  flex-shrink: 0;
  border-right: 1px solid var(--divider);
  background-color: var(--bg-paper);
  transition: width var(--transition-base);
  overflow: hidden;
}

.sidebar__header {
  display: flex;
  justify-content: flex-end;
  padding: var(--space-2);
  border-bottom: 1px solid var(--divider);
  flex-shrink: 0;
}

.sidebar > .sidebar__nav {
  overflow-y: auto;
  flex-grow: 1;
  padding: var(--space-2);
}

/* .sidebar's own max-width:1023px hide rule lives further down, folded into the
   existing tablet-tier @media block (see the Gate 8 touch-target comment there) rather
   than as a second block at the same breakpoint here — keeping one @media block per
   breakpoint also avoids a second unrelated bug: a test that isolates "the" 1023px
   block by regex would grab whichever one appears first in source order. The
   min-width:1024px counterpart hiding .icon-btn--menu lives right after that same
   block; placing it here instead, before .icon-btn's own base `display: flex` rule (in
   "Shared components" below), lost the cascade tie on equal specificity to whichever
   same-specificity rule comes LATER in source order (a real bug, caught by testing this
   at actual desktop width — the hamburger stayed visible instead of hiding). */

/* Collapsed state: pure CSS on top of the identical accordion markup/JS buildNavList()
   already produces for the expanded sidebar and the mobile drawer — not a second
   renderer. Group headers disappear (no room for their text at rail width) and every
   group is forced open regardless of its own --expanded class, turning the accordion
   into a flat icon-only rail; accordion interaction and mutual exclusion still work
   correctly once expanded again; nothing here touches expandedGroups' actual state. */
.sidebar--collapsed {
  width: 60px;
}

.sidebar--collapsed .sidebar__group-toggle {
  display: none;
}

.sidebar--collapsed .sidebar__group-items {
  max-height: none !important;
  padding: 0;
}

.sidebar--collapsed .sidebar__label {
  display: none;
}

.sidebar--collapsed .sidebar__link {
  justify-content: center;
  gap: 0;
}

/* UI/UX Overhaul Gate 2 revision: the mobile hamburger-triggered overlay (.drawer--left)
   below reuses these same .sidebar__nav/.sidebar__link class names (so this file's link/
   icon styling doesn't need separate rules), organized as click-to-expand accordion
   groups. Redesign Gate 4 above now reuses the identical markup a second way, for the
   persistent desktop sidebar — everything in this block applies to both. */
.sidebar__nav {
  list-style: none;
  margin: 0;
  padding: 0;
}

.sidebar__group + .sidebar__group {
  border-top: 1px solid var(--divider);
  margin-top: var(--space-1);
  padding-top: var(--space-1);
}

.sidebar__group-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: 10px var(--space-3);
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  transition: background-color var(--transition-fast);
}

.sidebar__group-toggle:hover {
  background-color: var(--hover-bg);
}

.sidebar__group-toggle .sidebar__group-label {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-xs);
  letter-spacing: 1.5px;
  color: var(--text-secondary);
}

.sidebar__group-chevron {
  color: var(--text-secondary);
  font-size: var(--text-base);
  transition: transform var(--transition-base);
}

.sidebar__group--expanded .sidebar__group-chevron {
  transform: rotate(90deg);
}

.sidebar__group-items {
  list-style: none;
  margin: 0;
  padding: 0 var(--space-2);
  max-height: 0;
  overflow: hidden;
  transition: max-height var(--transition-base);
}

.sidebar__group--expanded .sidebar__group-items {
  max-height: 600px;
}

.sidebar__link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px var(--space-3);
  margin-bottom: var(--space-1);
  border-radius: var(--radius-sm);
  border-left: 2px solid transparent;
  text-decoration: none;
  color: var(--text-primary);
  font-size: var(--text-base);
  font-weight: 500;
  cursor: pointer;
  transition: background-color var(--transition-fast), border-color var(--transition-fast);
}

.sidebar__link:hover {
  background-color: var(--hover-bg);
}

.sidebar__link.active {
  background-color: var(--hover-bg);
  border-left-color: var(--signal-amber);
}

/* Redesign Gate 3: was a 2-char mono text code, now an inline SVG — display:flex + a fixed
   svg size replaces the old text-align:center centering trick, which only worked for text. */
.sidebar__icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  flex-shrink: 0;
  opacity: 0.85;
}

.sidebar__icon svg {
  width: 18px;
  height: 18px;
}

.main-column {
  flex-grow: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ===== Title block header ===== */
.title-block {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--divider);
  background-color: var(--bg-paper);
}

.title-block__cell {
  padding: var(--space-2) var(--space-4);
}

.title-block__cell--grow {
  flex-grow: 1;
  min-width: 0;
}

/* Redesign Gate 1: dropped the ruled cell-divider borders and the mono, letter-spaced
   "instrument readout" styling both cells used before — a big part of the old technical-
   drawing title-block identity this gate moves away from. Font-family only changes here
   (still one shared class for both the page title and metadata cells); giving the page
   title its own distinct treatment needs a DOM-level class split, deferred to Gate 2. */
.title-block__label {
  display: block;
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0.4px;
  color: var(--text-secondary);
}

.title-block__value {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Daily-Use Audit Phase 5 (mobile alignment bug): a bare <span> is inline, so
     overflow/text-overflow above had no box to actually clip against — the page
     title (e.g. "Dashboard") rendered at its full natural width regardless of how
     little room .title-block__cell--grow had left after the action icons, visibly
     overlapping the first icon button on any narrow/phone viewport. display:block +
     max-width:100% gives it a real box the flex parent can actually shrink. */
  display: block;
  max-width: 100%;
}

/* Company/Client/Project Management redesign: the three cascading Company/Client/Project
   cells sit inside this shared flex wrapper so they lay out as one compact group ("Company
   ▾ Client ▾ Project ▾", spec point 15's own recommended layout) rather than each floating
   independently among the title-block's other cells. Hidden on mobile the same way every
   other non-growing title-block cell already is (see the .title-block__cell:not(--grow)
   media-query rule) — this group's own children carry that same base class, so no extra
   rule is needed there. */
.title-block__context-group {
  display: flex;
  align-items: stretch;
}

/* Redesign Gate 6 (Global Project Context): the shell header's project switcher — a
   real <select> (not a custom dropdown) so it behaves consistently with every other
   project picker already in this app, just restyled to sit quietly inside a title-block
   cell instead of looking like a form control. Blends in until hovered/focused. */
.title-block__project-select {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 13.5px;
  color: var(--text-primary);
  background-color: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 2px 4px;
  margin: -2px -4px;
  max-width: 180px;
  cursor: pointer;
}

/* Company/Client/Project Management redesign: three of these selects now sit side by side
   (see .title-block__context-group above) — narrower max-width and tighter cell padding
   than a single standalone select needed, so the trio doesn't crowd out the other
   title-block cells (SHEET, letterhead COMPANY, DATE) at typical desktop widths. */
.title-block__context-group .title-block__cell {
  padding-left: var(--space-2);
  padding-right: var(--space-2);
}

.title-block__context-group .title-block__project-select {
  max-width: 120px;
}

.title-block__context-group .title-block__project-select:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

.title-block__project-select:hover,
.title-block__project-select:focus {
  border-color: var(--divider);
  background-color: var(--bg-default);
}

.title-block__actions {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-2);
}

.icon-btn {
  border: none;
  background: transparent;
  color: var(--text-primary);
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: var(--text-md);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color var(--transition-fast);
}

/* Gate E (UI Modernization): icon-btn glyphs are inline SVG now, not Unicode text — font-size
   above is inert for them (harmless to leave; still sizes any button that legitimately shows
   text, like the export/import spinner swap) but SVG needs its own explicit size. */
.icon-btn svg {
  width: 16px;
  height: 16px;
}

.icon-btn:hover:not(:disabled) {
  background-color: var(--hover-bg);
}

.icon-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Hamburger nav trigger — the only way to reach navigation now, at every screen size
   (Outlook-Online-style: no persistent sidebar any more). */
.icon-btn--menu {
  flex-shrink: 0;
}

/* UI/UX Overhaul Gate 7 (Focus Mode): visual "this toggle is currently on" state,
   shared by any icon-btn that's a binary on/off toggle rather than a momentary action —
   today just the Focus Mode button, but written generically since density/theme could
   adopt the same treatment later instead of only changing their own glyph. */
.icon-btn--active {
  color: var(--signal-amber);
  background-color: var(--bg-paper-raised);
}

/* UI/UX Overhaul Gate 7 (Focus Mode). body.focus-mode is toggled by layout.js's
   toggleFocusMode() — global, not per-page, so leaving one focused page for another
   stays decluttered rather than snapping back. The footer is always safe to hide (pure
   status text, nothing interactive). .focus-mode-hide is the per-page opt-in: each page
   tags its OWN non-essential heading/description/picker-bar chrome with this class in
   its own markup — never a toolbar's actual filter/search/action controls, which every
   page keeps working normally in focus mode. */
body.focus-mode footer.app-footer {
  display: none;
}

body.focus-mode .focus-mode-hide {
  display: none;
}

main.page {
  flex-grow: 1;
  padding: var(--space-5);
}

footer.app-footer {
  border-top: 1px solid var(--divider);
  background-color: var(--bg-paper);
  padding: 6px var(--space-4);
  display: flex;
  justify-content: space-between;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--text-secondary);
}

/* ===== Shared components ===== */
/* Redesign Gate 2 (Component Restyling): dropped box-shadow from every resting/static card
   (.panel/.kpi-card/.project-card/.detail-card below) — border+shadow together on every single
   card read as visually heavy/busy, one of the "excessive borders" cues the redesign brief flags.
   Shadow now means genuine elevation only (.modal/.drawer/.card-menu__dropdown/the loading
   overlay), a standard modern-design-system convention; static content stays flat with a border
   alone to define its edge. */
.panel {
  background-color: var(--bg-paper);
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: 20px;
}

.panel + .panel {
  margin-top: var(--space-4);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}

.kpi-card {
  position: relative;
  background-color: var(--bg-paper);
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: 18px;
  transition: border-color var(--transition-base);
}

.kpi-card:hover {
  border-color: var(--text-secondary);
}

/* Same status icons as .status-badge (see --icon-status-* tokens), on the three KPI
   tiles that actually represent a status (on_track/at_risk/critical) rather than a plain
   count — ACTIVE PROJECTS/OVERDUE DOCS/DUE SOON carry no data-status and get no icon.
   --kpi-accent is set inline per card (KpiCard in Dashboard.tsx) from the same colorVar
   already driving the number's own color, so the icon never needs a separate token. */
.kpi-card[data-status]::after {
  content: "";
  position: absolute;
  top: 14px;
  right: 14px;
  width: 14px;
  height: 14px;
  background-color: var(--kpi-accent, var(--text-secondary));
  mask-repeat: no-repeat;
  mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: contain;
}
.kpi-card[data-status="on_track"]::after {
  mask-image: var(--icon-status-on-track);
  -webkit-mask-image: var(--icon-status-on-track);
}
.kpi-card[data-status="at_risk"]::after {
  mask-image: var(--icon-status-at-risk);
  -webkit-mask-image: var(--icon-status-at-risk);
}
.kpi-card[data-status="critical"]::after {
  mask-image: var(--icon-status-critical);
  -webkit-mask-image: var(--icon-status-critical);
}

/* Daily-Use Audit Phase 5 ("Dashboard's own KPI tiles aren't clickable"): rendered as
   a real <button> now, same "reset to look identical at rest" approach .card-stat--link
   already established — .kpi-card's own background/border/padding/radius above still
   apply unchanged, this only resets the button-specific defaults a <div> never had. */
.kpi-card--link {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.kpi-card__label {
  display: block;
  font-size: var(--text-xs);
  letter-spacing: 1px;
  color: var(--text-secondary);
  margin-bottom: var(--space-2);
}

.kpi-card__value {
  font-family: var(--font-mono);
  font-size: var(--text-2xl);
  font-weight: 600;
}

/* PCC Evolution Roadmap, Tier E: Portfolio Performance. A generic interactive data
   table — distinct from .report-doc table (print-report-specific, forced black text
   under @media print). Used first by Portfolio's Cards/Compare view toggle. */
.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table th {
  text-align: left;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-secondary);
  padding: var(--space-2) 10px;
  border-bottom: 1px solid var(--divider);
}

.data-table td {
  padding: var(--space-2) 10px;
  font-size: 13px;
  border-bottom: 1px solid var(--divider);
}

.data-table tbody tr:hover {
  background-color: var(--bg-paper);
}

/* Opt-in modifier, first given a real caller in UI/UX Overhaul Gate 7 (Better Data
   Grids — Schedule Activities). Sticks each <th> to the top of whatever scrolling
   ancestor the table sits in (the page itself, when the table's own wrapper only
   scrolls horizontally — see .data-table--frozen-first-col's own comment on why that
   split matters for the corner cell). */
.data-table--sticky-header th {
  position: sticky;
  top: 0;
  background-color: var(--bg-paper);
  z-index: 1;
}

/* Opt-in modifier, UI/UX Overhaul Gate 7 (Better Data Grids). Pins the first column
   (the row's own identifying label — e.g. Activity name) so it stays visible while the
   rest of a wide grid scrolls horizontally underneath it. Needs its own background
   (matching .panel's, which every .data-table today renders inside) so scrolled
   content doesn't visibly bleed through the sticky cells. When BOTH this and
   --sticky-header apply to the same table, the top-left corner cell is sticky on two
   axes at once and needs to paint above both the plain sticky-top header cells and the
   plain sticky-left body cells — hence the higher z-index on that one intersection. */
.data-table--frozen-first-col th:first-child,
.data-table--frozen-first-col td:first-child {
  position: sticky;
  left: 0;
  background-color: var(--bg-paper);
  z-index: 1;
  border-right: 1px solid var(--divider);
}
.data-table--sticky-header.data-table--frozen-first-col th:first-child {
  z-index: 2;
}

/* Opt-in modifier, UI/UX Overhaul Gate 7 (Better Data Grids). A sortable column
   header's clickable label + direction indicator — kept as a plain inline-flex button
   rather than restyling the whole <th>, so only the label/arrow are the click target,
   not the cell's full padding box. */
.data-table__sort-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  text-transform: inherit;
  letter-spacing: inherit;
  color: inherit;
  cursor: pointer;
}
.data-table__sort-btn:hover {
  color: var(--text-primary);
}
.data-table__sort-arrow {
  font-size: 9px;
  opacity: 0.7;
}

.btn {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 13.5px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  padding: 9px var(--space-4);
  cursor: pointer;
  transition: background-color var(--transition-fast), border-color var(--transition-fast),
    transform var(--transition-fast), opacity var(--transition-fast);
}

.btn:active {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.btn:focus-visible,
.icon-btn:focus-visible,
.sidebar__link:focus-visible,
a:focus-visible {
  outline: 2px solid var(--signal-amber);
  outline-offset: 2px;
}

.btn--primary {
  background-color: var(--signal-amber);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background-color: var(--signal-amber-dark);
}

.btn--ghost {
  background-color: transparent;
  border-color: var(--divider);
  color: var(--text-primary);
}

.btn--ghost:hover:not(:disabled) {
  background-color: var(--hover-bg);
  border-color: var(--text-secondary);
}

/* Size/semantic variants — additive, not yet adopted by any page this gate. Compose
   with .btn--primary/.btn--ghost (e.g. class="btn btn--ghost btn--sm"). */
.btn--sm {
  padding: 5px 11px;
  font-size: 12px;
}

.btn--danger {
  background-color: transparent;
  border-color: var(--status-critical);
  color: var(--status-critical);
}

.btn--danger:hover:not(:disabled) {
  background-color: rgba(229, 62, 62, 0.12);
}

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-bottom: 14px;
}

.field label {
  font-size: 12px;
  color: var(--text-secondary);
}

.field input,
.field select,
.field textarea {
  font-family: var(--font-body);
  font-size: var(--text-base);
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--divider);
  background-color: var(--bg-default);
  color: var(--text-primary);
  transition: border-color var(--transition-fast);
}

.field input:hover,
.field select:hover,
.field textarea:hover {
  border-color: var(--text-secondary);
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: 2px solid var(--signal-amber);
  outline-offset: -1px;
  border-color: var(--signal-amber);
}

.text-secondary {
  color: var(--text-secondary);
}

.mono {
  font-family: var(--font-mono);
}

/* ===== Loading indicator (Gate D, UI Modernization) =====
   .spinner + .loading-indicator are used two ways — see loadingIndicator.js: as a global
   blocking overlay (.loading-indicator-overlay) for waits with nothing on screen yet to show
   feedback in, and as an unattached inline fragment callers insert into their own layout
   (a form field, a modal body, a toolbar) for waits that already have somewhere to render. */
.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--divider);
  border-top-color: var(--signal-amber);
  border-radius: 50%;
  flex-shrink: 0;
  animation: spin 700ms linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-indicator {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

.loading-indicator-overlay {
  position: fixed;
  inset: 0;
  z-index: 1150;
  background-color: rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
}

.loading-indicator-overlay .loading-indicator {
  background-color: var(--bg-paper);
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  box-shadow: var(--shadow-lg);
}

/* ===== Toasts ===== */
#toast-stack {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  z-index: 1000;
}

.toast {
  min-width: 260px;
  max-width: 360px;
  padding: var(--space-3) 14px;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 13px;
  color: #12141a;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  animation: toast-in var(--transition-base);
}

/* Animation polish pass: applied by reactBridge.js's mount() to #page-outlet on every
   route change (every route is React now, so this is the one place that reaches all of
   them). Fast and opacity-only per the same Operate-mode motion rules as everywhere else
   in this file — a cue that something changed, not a page-load sequence to sit through. */
.route-fade-in {
  animation: route-fade-in 150ms ease;
}
@keyframes route-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.toast--success { background-color: var(--status-on-track); }
.toast--error { background-color: var(--status-critical); color: #fff; }
.toast--info { background-color: var(--status-info); color: #fff; }
.toast--warning { background-color: var(--status-at-risk); }

/* ===== Login-style splash (data file load) ===== */
.splash {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.splash__panel {
  width: 420px;
  max-width: 90vw;
}

/* ===== Portfolio ===== */
.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
  align-items: center;
}

.toolbar input[type="text"],
.toolbar select {
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--divider);
  background-color: var(--bg-default);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13px;
}

.toolbar input[type="text"] {
  flex: 1 1 220px;
  min-width: 160px;
}

.toolbar__spacer {
  flex: 1 1 auto;
}

/* Tab bars (Schedule: Activities/Gantt/WBS/Relationships/Baselines; Cost Tracking:
   Budget/Actuals/Summary) — deliberately distinct from .toolbar's filter/action
   buttons: an underline style instead of solid pills, so the page's primary
   navigation reads as a different kind of control than a filter or a form action. */
.tab-bar {
  display: flex;
  gap: var(--space-1);
  border-bottom: 1px solid var(--divider);
  margin-bottom: var(--space-4);
  overflow-x: auto;
}

.tab-btn {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 13.5px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  padding: 10px 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: color var(--transition-fast), border-color var(--transition-fast);
}

.tab-btn:hover:not(.tab-btn--active) {
  color: var(--text-primary);
}

.tab-btn--active {
  color: var(--text-primary);
  border-bottom-color: var(--signal-amber);
}

.tab-btn:focus-visible {
  outline: 2px solid var(--signal-amber);
  outline-offset: -2px;
}

.project-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* UI/UX Overhaul Gate 6 (Documents): register + preview two-panel layout, per the
   brief's own "Document Experience" section. flex-wrap (not a media query) stacks the
   panels on narrow viewports — the same responsive approach Gates 3-5 already use
   throughout this app, rather than a new breakpoint-specific rule. */
.doc-register {
  display: flex;
  gap: var(--space-4);
  flex-wrap: wrap;
  align-items: flex-start;
}

.doc-register-list {
  flex: 1 1 340px;
  min-width: 280px;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.doc-register-item {
  background-color: var(--bg-paper);
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: 10px var(--space-3);
  padding-left: 34px;
  position: relative;
  cursor: pointer;
  transition: border-color var(--transition-base), background-color var(--transition-base);
}

/* Daily-Use Audit Phase 3 (bulk actions): positioned absolutely rather than prepended
   inline like .project-card__select, since this row's whole click area already opens
   the preview panel (.doc-register-item's own onclick) — a separate corner target keeps
   that click-to-preview behavior intact everywhere except the checkbox itself. */
.doc-register-item__select {
  position: absolute;
  top: 12px;
  left: var(--space-3);
  width: 16px;
  height: 16px;
  cursor: pointer;
}

.doc-register-item:hover {
  border-color: var(--text-secondary);
}

.doc-register-item--selected {
  border-color: var(--signal-amber);
  background-color: var(--bg-paper-raised);
}

.doc-register-item__name {
  font-weight: 600;
  font-size: 13.5px;
  word-break: break-word;
}

.doc-register-item__meta {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.doc-register-item__badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}

.doc-register-preview {
  flex: 2 1 480px;
  min-width: 320px;
}

/* UI/UX Overhaul Gate 7 (Resizable Panels). A thin drag handle between the register
   list and the preview pane — align-self:stretch so it spans the full row height
   regardless of which pane is taller. The visible line is a pseudo-element, not the
   handle's own background, so the actual (generous, easy-to-grab) hit target can stay
   wider than what's drawn. Hidden below 780px: .doc-register already stacks its two
   panes into one column there (existing flex-wrap behavior, no new breakpoint rule),
   where a horizontal-drag handle between two STACKED panes would be a stray sliver
   with nothing meaningful to do. */
.doc-register-resize-handle {
  width: 10px;
  flex-shrink: 0;
  align-self: stretch;
  cursor: col-resize;
  position: relative;
}
.doc-register-resize-handle::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 4px;
  width: 2px;
  background-color: var(--divider);
}
.doc-register-resize-handle:hover::after,
.doc-register-resize-handle--dragging::after {
  background-color: var(--signal-amber);
}
@media (max-width: 780px) {
  .doc-register-resize-handle {
    display: none;
  }
}

/* UI/UX Overhaul Gate 7 (Side-by-Side Views). Same two-panel spirit as
   .doc-register/.doc-register-list/.doc-register-preview above — chart on the left,
   Activity Detail Panel on the right, flex-wrap stacking them on narrow viewports
   rather than a dedicated breakpoint rule, matching this app's usual responsive
   approach. The chart pane gets min-width:0 so its own overflow-x:auto scroll
   container (set inline by schedule.js) can still shrink below its natural content
   width instead of forcing the row to overflow. */
.gantt-layout-row {
  display: flex;
  gap: var(--space-4);
  flex-wrap: wrap;
  align-items: flex-start;
}

.gantt-layout-row > .panel {
  flex: 1 1 480px;
  min-width: 0;
}

.gantt-detail-pane {
  flex: 1 1 360px;
  max-width: 420px;
  min-width: 300px;
}

.project-card {
  background-color: var(--bg-paper);
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: 14px var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-wrap: wrap;
  transition: border-color var(--transition-base);
}

.project-card:hover {
  border-color: var(--text-secondary);
}

.project-card--archived {
  opacity: 0.6;
}

.project-card__main {
  flex: 1 1 220px;
  min-width: 0;
}

.project-card__name {
  font-weight: 600;
  font-size: var(--text-md);
}

.project-card__meta {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
  line-height: 1.5;
}

.project-card__figures {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--text-secondary);
  min-width: 140px;
}

.project-card__progress {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 140px;
}

/* Gate 3 (UI/UX Overhaul, Portfolio): health-focused stat chips on each project card
   (Open Risks/Issues, Open RFIs/TQs, Document Availability) — cheap counts computed
   directly from the store, not via Executive Center's heavy CPM-engine
   buildProjectContext, which would be far too expensive to run once per card in a
   list. Schedule status is deliberately NOT a separate figure here — the card's
   existing status badge already carries that signal (Aditya's own call, Gate 3
   scoping round). */
.project-card__stats {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  min-width: 160px;
}

.card-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.card-stat__label {
  font-size: 10.5px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.card-stat__value {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
}

/* Redesign Gate 8 (Project Workspace header vitals: Schedule Status, Key Milestone,
   Current Health): the first non-numeric use of this chip — every prior .card-stat
   value has been a count or a ratio. Matches Gate 1's own established distinction
   (mono stays for genuinely numeric/tabular content only) rather than mono-formatting
   plain status text. */
.card-stat__value--text {
  font-family: var(--font-body);
}

/* Redesign Gate 7 (Dashboard Portfolio Exceptions panel): a clickable variant of the
   same .card-stat chip, as a real <button> instead of a <div> — reset to look identical
   at rest, with a hover/focus affordance so it doesn't read as inert like the plain
   per-project-card stats above it. */
.card-stat--link {
  border: none;
  background: transparent;
  padding: 6px 8px;
  margin: -6px -8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: inherit;
}

.card-stat--link:hover,
.card-stat--link:focus {
  background-color: var(--hover-bg);
}

/* Contextual "..." menu (Edit/Archive) — PCC's first menu/dropdown component. Gate 1
   shipped modal/drawer primitives but no menu; this is small and net-new, scoped to
   this gate's own need rather than a general-purpose menu system. */
.card-menu {
  position: relative;
  display: inline-block;
}

.card-menu__overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: transparent;
  border: none;
  padding: 0;
  cursor: default;
}

.card-menu__dropdown {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 41;
  min-width: 130px;
  background-color: var(--bg-paper-raised);
  border: 1px solid var(--divider);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  padding: var(--space-1);
  display: flex;
  flex-direction: column;
}

.card-menu__item {
  border: none;
  background: transparent;
  color: var(--text-primary);
  text-align: left;
  font-size: 13px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}

.card-menu__item:hover {
  background-color: var(--hover-bg);
}

/* UI/UX Overhaul Gate 7 (Better Data Grids): a checkbox row inside .card-menu__dropdown
   — same popover, different item shape (a toggle, not an action) — used by Schedule
   Activities' column-visibility menu. Kept as its own class rather than overloading
   .card-menu__item since a <label> needs flex alignment a <button> doesn't. */
.card-menu__checkbox-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
}

.card-menu__checkbox-item:hover {
  background-color: var(--hover-bg);
}

.progress-track {
  width: 100px;
  height: 6px;
  background-color: var(--divider);
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}

.progress-fill {
  height: 100%;
  background-color: var(--signal-amber);
}

/* Status-colored variants — additive, opt-in (e.g. class="progress-fill progress-fill--critical").
   No existing progress bar uses one yet; the default stays plain amber. */
.progress-fill--on_track { background-color: var(--status-on-track); }
.progress-fill--at_risk { background-color: var(--status-at-risk); }
.progress-fill--warning { background-color: var(--status-warning); }
.progress-fill--critical { background-color: var(--status-critical); }
.progress-fill--info { background-color: var(--status-info); }

/* Labeled progress bar — a heavier variant of .progress-track/.progress-fill for
   contexts that need a label + percentage above the bar (project health cards,
   Executive Center panels). Not yet used by any page this gate. */
.progress-bar {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.progress-bar__row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: var(--text-sm);
}

.progress-bar__label {
  color: var(--text-secondary);
}

.progress-bar__value {
  font-family: var(--font-mono);
  font-weight: 600;
}

.progress-bar__track {
  width: 100%;
  height: 8px;
  background-color: var(--divider);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.progress-bar__fill {
  height: 100%;
  background-color: var(--signal-amber);
  border-radius: var(--radius-sm);
  transition: width var(--transition-base);
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 10.5px;
  padding: 3px 9px;
  border-radius: var(--radius-lg);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* Status icons (Lucide, see --icon-status-* tokens above) — status was already carried by
   both color AND the text label, so this isn't fixing a real accessibility gap on its own;
   it's the same information a third way, which reads faster at a glance across a dense
   table of badges. mask-image + background-color:currentColor means the icon always
   matches the badge's own (already-4.5:1-verified) text color automatically, in both
   themes, with no separate icon-color token to keep in sync. */
.status-badge::before {
  content: "";
  width: 10px;
  height: 10px;
  flex-shrink: 0;
  background-color: currentColor;
  mask-repeat: no-repeat;
  mask-size: contain;
  mask-position: center;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: contain;
  -webkit-mask-position: center;
}

.status-badge--on_track {
  background-color: rgba(31, 157, 108, 0.15);
  color: var(--status-badge-on-track-text);
}
.status-badge--on_track::before {
  mask-image: var(--icon-status-on-track);
  -webkit-mask-image: var(--icon-status-on-track);
}
.status-badge--at_risk {
  background-color: rgba(214, 158, 46, 0.15);
  color: var(--status-badge-at-risk-text);
}
.status-badge--at_risk::before {
  mask-image: var(--icon-status-at-risk);
  -webkit-mask-image: var(--icon-status-at-risk);
}
.status-badge--warning {
  background-color: rgba(221, 107, 32, 0.15);
  color: var(--status-badge-warning-text);
}
.status-badge--warning::before {
  mask-image: var(--icon-status-warning);
  -webkit-mask-image: var(--icon-status-warning);
}
.status-badge--critical {
  background-color: rgba(229, 62, 62, 0.15);
  color: var(--status-badge-critical-text);
}
.status-badge--critical::before {
  mask-image: var(--icon-status-critical);
  -webkit-mask-image: var(--icon-status-critical);
}
.status-badge--complete {
  background-color: rgba(14, 154, 167, 0.15);
  color: var(--status-badge-info-text);
}
.status-badge--complete::before {
  mask-image: var(--icon-status-on-track);
  -webkit-mask-image: var(--icon-status-on-track);
}
.status-badge--info {
  background-color: rgba(14, 154, 167, 0.15);
  color: var(--status-badge-info-text);
}
.status-badge--info::before {
  mask-image: var(--icon-status-info);
  -webkit-mask-image: var(--icon-status-info);
}

.project-card__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* Daily-Use Audit Phase 3 (bulk actions): a checkbox prepended to .project-card, which
   is already a flex row with align-items:center — sits naturally in that row with no
   layout changes needed elsewhere. */
.project-card__select {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  cursor: pointer;
}

/* The "N selected · [bulk action buttons] · Clear" bar shown above a register's list
   once at least one row is checked — same panel/pill language as the rest of the app,
   distinguished with the accent color so it reads as a temporary, active state rather
   than a fourth persistent toolbar. */
.bulk-action-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-3);
  background-color: var(--bg-paper-raised);
  border: 1px solid var(--signal-amber);
  border-radius: var(--radius-md);
  padding: 10px var(--space-4);
  margin-bottom: var(--space-3);
}

.bulk-action-bar__count {
  font-size: var(--text-sm);
  font-weight: 600;
}

.bulk-action-bar__spacer {
  flex: 1 1 auto;
}

.project-entry {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.project-details {
  background-color: var(--bg-paper-raised);
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}

/* Used for individual rows inside a list (Schedule's Activities/WBS/Relationships/
   Baselines tabs, Cost Tracking's Budget/Actuals/Summary lists) — same visual
   language as .project-card but slightly more compact, since these sit one per row
   inside an already-titled tab rather than needing their own strong identity. */
.detail-card {
  background-color: var(--bg-paper);
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: var(--space-3) 14px;
  transition: border-color var(--transition-base);
}

.detail-card:hover {
  border-color: var(--text-secondary);
}

.detail-card .text-secondary {
  line-height: 1.5;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px var(--space-5);
}

.detail-item__label {
  display: block;
  color: var(--text-secondary);
  font-size: 10.5px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  margin-bottom: 3px;
}

.detail-item__value {
  font-size: 13.5px;
}

@media (max-width: 780px) {
  .detail-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .detail-grid {
    grid-template-columns: 1fr;
  }
}

.empty-state {
  text-align: center;
  padding: var(--space-7) 20px;
  color: var(--text-secondary);
  border-style: dashed;
  box-shadow: none;
  font-size: 13.5px;
  line-height: 1.6;
}

.empty-state::before {
  content: "";
  display: block;
  width: 28px;
  height: 28px;
  margin: 0 auto var(--space-3);
  background-color: var(--text-secondary);
  opacity: 0.5;
  mask-image: var(--icon-empty-state);
  mask-repeat: no-repeat;
  mask-size: contain;
  mask-position: center;
  -webkit-mask-image: var(--icon-empty-state);
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: contain;
  -webkit-mask-position: center;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0 var(--space-4);
}

/* ===== Risk heat map ===== */
.heatmap {
  display: grid;
  grid-template-columns: 90px repeat(3, 1fr);
  grid-template-rows: auto repeat(3, 64px);
  gap: var(--space-1);
  max-width: 440px;
}

.heatmap-corner {
  /* empty top-left cell */
}

.heatmap-col-label,
.heatmap-row-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  letter-spacing: 0.5px;
}

.heatmap-row-label {
  justify-content: flex-end;
  text-align: right;
  padding-right: 6px;
}

.heatmap-cell {
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--divider);
  transition: transform var(--transition-fast), border-color var(--transition-fast);
}

.heatmap-cell:hover {
  transform: scale(1.04);
  border-color: var(--text-secondary);
}

.heatmap-cell--low {
  background-color: rgba(31, 157, 108, 0.18);
  color: var(--status-badge-on-track-text);
}
.heatmap-cell--medium {
  background-color: rgba(214, 158, 46, 0.2);
  color: var(--status-badge-at-risk-text);
}
.heatmap-cell--high {
  background-color: rgba(229, 62, 62, 0.22);
  color: var(--heatmap-high-text);
}

.heatmap-cell--active {
  outline: 2px solid var(--signal-amber);
  outline-offset: -2px;
}

@media (max-width: 780px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}

/* ===== New primitives (Gate 1: Design System) =====
   All inert this gate — no page (src/js/pages/*.js) references any class below yet.
   Groundwork for later gates: Management Attention (Gate 3/5, already used ad hoc by
   dashboard.js/executiveCenter.js — this gives it one consistent shared visual pattern
   instead of each page hand-building its own), and a Modal/Drawer base (the brief lists
   both under Gate 1 "Navigation primitives"; PCC currently has no modal system at all —
   forms open inline — so this is new, not a refinement of something existing). */

/* ---- Management Attention list ---- */
.attention-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.attention-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px var(--space-1);
  border-bottom: 1px solid var(--divider);
}

.attention-item:last-child {
  border-bottom: none;
}

/* Gate F (UI Modernization): opt-in modifier, not a blanket .attention-item:hover — some
   rows using this class aren't clickable (executiveCenter.js's Diagnostics panel only
   wires an onclick when a.link.module exists), so a hover rule keyed to .attention-item
   itself would visually promise every row is clickable when some aren't. */
.attention-item--clickable {
  cursor: pointer;
  transition: background-color var(--transition-fast);
}

.attention-item--clickable:hover {
  background-color: var(--hover-bg);
}

/* A resting-state chevron, not just the hover background above — a row that only
   signals "clickable" once you're already hovering it isn't discoverable at all before
   that first hover. Faint at rest, full opacity on hover, so it reads as a real
   affordance without competing with the row's own text for attention. */
.attention-item--clickable::after {
  content: "";
  align-self: center;
  margin-left: auto;
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  background-color: var(--text-secondary);
  opacity: 0.35;
  transition: opacity var(--transition-fast);
  mask-image: var(--icon-chevron-right);
  mask-repeat: no-repeat;
  mask-size: contain;
  -webkit-mask-image: var(--icon-chevron-right);
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: contain;
}

.attention-item--clickable:hover::after {
  opacity: 0.8;
}

.attention-item__icon {
  flex-shrink: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 6px;
}

.attention-item__icon--critical { background-color: var(--status-critical); }
.attention-item__icon--warning { background-color: var(--status-warning); }
.attention-item__icon--at_risk { background-color: var(--status-at-risk); }
.attention-item__icon--info { background-color: var(--status-info); }
/* Redesign Gate 10 (Module Consistency Pass): the first attention-item consumer with a
   genuinely positive severity (Vendor Performance Centre's "On Track" rating band) — the
   four modifiers above are all attention-worthy by design, none fit a good outcome. */
.attention-item__icon--on_track { background-color: var(--status-on-track); }

.attention-item__body {
  min-width: 0;
  flex-grow: 1;
}

.attention-item__text {
  font-size: var(--text-base);
}

.attention-item__meta {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ---- Modal ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
  z-index: 1100;
  animation: overlay-in var(--transition-base);
}

.modal {
  background-color: var(--bg-paper);
  border: 1px solid var(--divider);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  animation: modal-in var(--transition-base);
}

.modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--divider);
}

.modal__title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
}

.modal__body {
  padding: var(--space-5);
  overflow-y: auto;
}

.modal__footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--divider);
}

@keyframes overlay-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modal-in {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---- Drawer (right-edge slide-in panel) ---- */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 1100;
  animation: overlay-in var(--transition-base);
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 420px;
  max-width: 92vw;
  background-color: var(--bg-paper);
  border-left: 1px solid var(--divider);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  animation: drawer-in var(--transition-base);
}

.drawer__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--divider);
}

.drawer__title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
}

.drawer__body {
  padding: var(--space-3) var(--space-3) var(--space-5);
  overflow-y: auto;
  flex-grow: 1;
}

@keyframes drawer-in {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}

/* Left-anchored variant — the nav overlay (layout.js's openNav) is the one drawer
   consumer that needs to slide out from the same edge as the hamburger button that
   opens it (top-left), rather than the generic primitive's default right edge. */
.drawer--left {
  right: auto;
  left: 0;
  border-left: none;
  border-right: 1px solid var(--divider);
  animation: drawer-in-left var(--transition-base);
}

@keyframes drawer-in-left {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

/* Animation polish pass: the nav drawer (layout.js's openNav/closeNav) previously only
   animated in — closeNav() called overlay.remove() immediately, so it vanished instantly
   while every open used the slide-in above. --closing is added by closeNav() before its
   own setTimeout(..., 180) actually removes the node, giving the reverse motion time to
   play — exit runs at the same duration as enter here (unlike the animate-skill's usual
   "exit faster" guidance) because this is a full-height nav panel, not a small transient
   control; a same-speed close reads as an undo of the same movement, not a lag. */
.drawer-overlay--closing {
  animation: overlay-out var(--transition-base) forwards;
}
.drawer-overlay--closing .drawer {
  animation: drawer-out var(--transition-base) forwards;
}
.drawer-overlay--closing .drawer--left {
  animation: drawer-out-left var(--transition-base) forwards;
}

@keyframes overlay-out {
  from { opacity: 1; }
  to { opacity: 0; }
}
@keyframes drawer-out {
  from { transform: translateX(0); }
  to { transform: translateX(100%); }
}
@keyframes drawer-out-left {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}

/* The nav overlay reuses .sidebar__nav/.sidebar__link (layout.js's buildNavList()) —
   larger, touch-sized rows than a hypothetical persistent-sidebar context would need. */
.drawer .sidebar__nav {
  padding: 0;
}

.drawer .sidebar__link {
  padding: 13px var(--space-3);
  font-size: var(--text-md);
}

/* ---- Density control ----
   UI/UX Overhaul Gate 7 (Desktop/Laptop Productivity). "Comfortable" (no attribute) is
   the app's original, unchanged spacing — every value below matches what these
   selectors already hardcoded before this gate, so a comfortable install looks
   pixel-identical to before. "Compact"/"spacious" were built (and, for the token part,
   reserved since Gate 1) as a matched step in each direction from that baseline.

   Two things had to be overridden, not one: the --space-3/4/5 TOKENS (below, reserved
   since Gate 1) only ever fed .modal/.drawer's own padding — verified by grepping for
   real consumers before wiring this up. Every screen that actually matters for
   day-to-day density (main.page, .panel, .toolbar, .project-card, .project-list,
   .form-grid) was hardcoded in px, not tokenized, so a toggle wired to the tokens alone
   would persist correctly but be invisible almost everywhere. The second block of rules
   below overrides those specific hardcoded properties directly — surgical additions
   scoped to [data-density], not a retrofit of the existing rules to consume variables
   (safer: nothing about their comfortable-mode behavior changes). Toggled by layout.js's
   density toggle (title-block icon-btn, same pattern as the theme toggle next to it) via
   settings.density + this data-attribute. */
[data-density="compact"] {
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
}

[data-density="spacious"] {
  --space-3: 16px;
  --space-4: 20px;
  --space-5: 32px;
}

[data-density="compact"] main.page {
  padding: 16px;
}
[data-density="spacious"] main.page {
  padding: 32px;
}

[data-density="compact"] .panel {
  padding: 14px;
}
[data-density="compact"] .panel + .panel {
  margin-top: 10px;
}
[data-density="spacious"] .panel {
  padding: 28px;
}
[data-density="spacious"] .panel + .panel {
  margin-top: 22px;
}

[data-density="compact"] .toolbar {
  gap: 6px;
  margin-bottom: 10px;
}
[data-density="spacious"] .toolbar {
  gap: 14px;
  margin-bottom: 22px;
}

[data-density="compact"] .project-card {
  padding: 10px 12px;
  gap: 10px;
}
[data-density="spacious"] .project-card {
  padding: 18px 22px;
  gap: 20px;
}

[data-density="compact"] .project-list {
  gap: 6px;
}
[data-density="spacious"] .project-list {
  gap: 14px;
}

[data-density="compact"] .form-grid {
  gap: 0 12px;
}
[data-density="spacious"] .form-grid {
  gap: 0 22px;
}

/* ===== Responsive: Laptop tier (1024-1279px) =====
   UI/UX Overhaul Gate 2. The sidebar itself stays full-width here by default — Gate 2
   deliberately doesn't auto-collapse it (manual toggle only, same as every tier down to
   Tablet; see .sidebar--collapsed). This tier just tightens the main content padding a
   touch, matching the brief's "reduce unnecessary padding... prioritize the main
   workspace" for laptop specifically without changing any layout structure. */
@media (max-width: 1279px) {
  main.page {
    padding: 20px;
  }
}

/* ===== Responsive: title-block overflow gap (GATE 1 UI/UX audit, 2026-09-04) =====
   Real, confirmed bug: the title-block header (SHEET/page-title cell, the Company/Client/
   Project context-group, the Company/Date display cells, and the action-icon row) has no
   flex-wrap and nothing thins it between the phone tier below (<=780px, which already hides
   the non-growing cells) and roughly 1150px, where there's finally enough room again. Two
   real device widths land squarely in that gap: 1024x768 (the standard tablet-landscape
   resolution) — where the persistent sidebar first turns on at exactly min-width:1024px and
   eats 236px of content width — and the ~800-1000px band generally, where the touch-target
   tier's 44px icon buttons (see the <=1023px block below) take more room than the desktop
   32px ones. Confirmed via real Chromium: every route overflows the page horizontally in
   both bands (scrollWidth > clientWidth), visibly overlapping the SHEET/page-title text.
   Fix: reuse the exact same "hide the non-essential display cells, let the grow cell and the
   actions stay" strategy the phone tier already ships (see .title-block__cell:not(--grow)
   inside the <=780px block near the end of this file) at a wider threshold that actually
   covers the gap. The Company/Date cells are plain display text (see buildTitleBlock() in
   layout.js — Date is just today's date, not an editable control), and the Company/Client/
   Project context-group is a convenience duplicate of filtering every page already offers in
   its own toolbar — nothing here removes a capability, only the same header-only redundancy
   the phone tier already accepts. */
@media (max-width: 1150px) {
  body {
    overflow-x: hidden;
  }

  .title-block__cell:not(.title-block__cell--grow) {
    display: none;
  }

  .title-block__cell--grow {
    min-width: 0;
  }
}

/* ===== Responsive: Tablet tier (<= 1023px) — touch targets =====
   UI/UX Overhaul Gate 8. The first rule targeting this tier specifically (768-1023px
   per the brief; written as max-width:1023px since it also covers mobile, where these
   same controls need the same enlarging). Every icon-btn/menu-item/checkbox row in the
   app was sized for a mouse pointer — 32px icon buttons, tightly-padded menu rows —
   comfortably clickable but noticeably below the ~44px touch target platforms
   recommend. Scoped to this tier only: desktop/laptop keep their current, denser
   sizing untouched, since a mouse doesn't need the extra padding a fingertip does.
   Redesign Gate 4 folded .sidebar's own hide-below-1024px rule in here too, rather than
   opening a second @media block at the same breakpoint elsewhere in the file. */
@media (max-width: 1023px) {
  .sidebar {
    display: none;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    font-size: 17px;
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
  }

  .btn {
    padding: 12px 18px;
  }

  .btn--sm {
    padding: 9px 14px;
  }

  .card-menu__item,
  .card-menu__checkbox-item {
    padding: 11px 14px;
  }
}

/* Redesign Gate 4: hides the hamburger once the persistent .sidebar takes over at
   >=1024px — placed here, after .icon-btn's own base `display: flex` rule above, so this
   `display: none` actually wins the cascade tie on equal specificity (a real bug when
   this lived earlier in the file — see the note near .sidebar's own display:none rule). */
@media (min-width: 1024px) {
  .icon-btn--menu {
    display: none;
  }
}

/* UI/UX Overhaul Gate 8: Schedule Activities' mobile card fallback (see
   buildActivityMobileCard() in schedule.js) is always built, alongside the real
   <table> data grid — this rule is what actually keeps it hidden above the phone
   breakpoint below, matching .doc-register-resize-handle's own "always built, CSS
   decides which one shows" approach a few rules up. */
.activities-mobile-cards {
  display: none;
}

/* UI/UX Overhaul Gate 8: same "always built, CSS decides which one shows" split for
   the Gantt tab — .gantt-mobile-timeline (see the end of renderGanttTab() in
   schedule.js) stays hidden until the phone breakpoint below takes over from the
   interactive chart. */
.gantt-mobile-timeline {
  display: none;
}

/* ===== Responsive: narrow / phone widths =====
   Navigation itself (the hamburger + overlay) is already identical at every screen size
   — nothing sidebar-related left to adjust here. Below ~780px the title block still
   drops its secondary cells (company/date) to leave room for the sheet name and action
   icons, and forms/toolbars stack to one control per row. */
@media (max-width: 780px) {
  body {
    overflow-x: hidden;
  }

  /* UI/UX Overhaul Gate 8: swap the Schedule Activities data grid (Gate 7) for its
     stacked-card fallback — a many-column table has nowhere to go at phone widths but
     a fight with horizontal scroll, exactly what the brief's "avoid tiny tables"
     guidance warns against. */
  .activities-table-wrap {
    display: none;
  }
  .activities-mobile-cards {
    display: flex;
  }

  /* UI/UX Overhaul Gate 8: swap the interactive Gantt chart for a read-only, tap-to-
     open-details timeline at phone widths — dragging a bar to reschedule needs a mouse
     (or at least a lot more precision than a fingertip on a 2px-tall handle), and the
     chart's own toolbar already fills the screen before any bar would be visible.
     !important is required here specifically because these elements set their own
     inline display (flex, for their internal layout) — the same reason .panel's
     max-width override a few rules below needs it too; a plain class rule can't win
     against an inline style otherwise. */
  .gantt-chart-panel,
  .gantt-chart-only-control {
    display: none !important;
  }
  /* .gantt-mobile-timeline is also .project-list, which already sets flex-direction/gap
     — only display needs overriding here. */
  .gantt-mobile-timeline {
    display: flex;
  }

  /* One control per row instead of the desktop's wrapped multi-filter row — easier
     to tap and read on a phone than several inputs crammed into a wrapped strip. */
  .toolbar input[type="text"],
  .toolbar select {
    flex-basis: 100%;
  }

  /* Daily-Use Audit Phase 5 (mobile alignment): no physical keyboard on a phone, so
     the keyboard-shortcuts icon has nothing to do there — dropping it also frees just
     enough header width for the page title to stop truncating to 1-2 characters on
     common short titles ("Dashboard", "Settings", etc). See shortcutsBtn's own
     comment in layout.js. */
  .icon-btn--hide-mobile {
    display: none;
  }

  .title-block__cell:not(.title-block__cell--grow) {
    display: none;
  }

  .title-block__cell--grow {
    min-width: 0;
  }

  main.page {
    padding: var(--space-4);
  }

  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .panel {
    max-width: none !important;
  }

  h2 {
    font-size: 20px;
  }
}

@media (max-width: 420px) {
  .kpi-grid {
    grid-template-columns: 1fr;
  }

  .kpi-card__value {
    font-size: var(--text-xl);
  }
}

/* --- Reduced motion (GATE 1 UI/UX audit finding, 2026-09-04) ---
   Real, confirmed gap: nothing in this file respected prefers-reduced-motion before this —
   every transition/animation ran unconditionally regardless of the user's OS-level setting.
   A blanket 0.01ms kill on every animation is the standard fix, but not a safe one to apply
   completely blindly (see .claude/docs/MOTION_SYSTEM.md and the vendored WCAG skill's own
   warning: killing a functional loading indicator's duration doesn't remove it, it freezes
   it mid-rotation, which reads as more broken than either a spinning or a static state).
   `.spinner`'s `animation: spin 700ms linear infinite` (the only `infinite` animation in this
   file) is exactly that case — a functional "still working" indicator, not decorative motion —
   so it's excluded here and keeps spinning under reduced motion. Every other transition/
   animation in this file (toast/modal/drawer/overlay enter, hover/press feedback) is a one-shot
   state-change cue with no continuous loop, so instant-ifying it loses nothing: the state change
   itself still happens, only its animated cue does not. */
@media (prefers-reduced-motion: reduce) {
  *:not(.spinner),
  *:not(.spinner)::before,
  *:not(.spinner)::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* --- Print / Save-as-PDF (Phase 8: Basic Reporting) ---
   Browser-native printing, no bundled PDF library: hides the app chrome (sidebar,
   title block, footer, and anything with .no-print) so window.print() produces just
   the report content. .report-doc gets light, high-contrast, ink-friendly styling
   regardless of the app's current dark/light theme, since printed reports should
   read the same on paper no matter which theme was active on screen. */
@media print {
  .sidebar,
  .title-block,
  .app-footer,
  .no-print {
    display: none !important;
  }

  #app-shell,
  .main-column,
  .page,
  #page-outlet {
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
  }

  .report-doc {
    color: #000 !important;
    background: #fff !important;
  }

  /* Gate 9 (Project Executive Center): the one-page Project Snapshot is meant for A4
     landscape specifically (wide KPI/overview grid), while every other report in this
     app (Project Status/Portfolio Summary, the Management Pack) stays portrait — a CSS
     named page targets just the snapshot's own printed pages without changing the
     default @page setup everything else relies on. */
  @page snapshot-page {
    size: A4 landscape;
    margin: 10mm;
  }
  .snapshot-doc {
    page: snapshot-page;
  }

  .report-doc * {
    color: #000 !important;
    background: transparent !important;
    border-color: #999 !important;
  }

  .report-doc table {
    width: 100%;
    border-collapse: collapse;
  }

  .report-doc th,
  .report-doc td {
    border: 1px solid #999;
    padding: 4px 6px;
    font-size: 11px;
    text-align: left;
  }

  .report-doc h2,
  .report-doc h3 {
    break-after: avoid;
  }

  .report-doc__section {
    break-inside: avoid;
    margin-bottom: 16px;
  }
}

.report-doc {

}

.report-doc__section {

  padding-bottom: 14px;
  border-bottom: 1px solid var(--divider);

.report-doc table {

.report-doc td {

/* Project Control Center — data store.
 * No backend, no server. Everything lives in one JS object (window.PCC.store.data),
 * autosaved to localStorage on every change, and exportable to a single
 * project-data.json file for moving between machines.

(function () {

  var SCHEMA_VERSION = 65;

  function emptyData() {

        created_at: new Date().toISOString(),

      settings: {

        // where the sidebar is replaced entirely by the hamburger+drawer nav instead.

        // schema v53 migration below for why that's the safe default.
        density: "comfortable",
        company_name: "",
        backup_reminder_days: 7,

        // UPCOMING_WINDOW_DAYS in actionCentre.js) since the gates that introduced them
        // — now user-configurable. Defaults match those original hardcoded values
        // exactly, so no existing install's behavior changes on upgrade.
        document_reminder_due_soon_days: 14,
        action_centre_upcoming_days: 30,
        // PCC Evolution Roadmap, Tier 3 ("final polish"): Report Template System.
        // Metadata only — the actual logo bytes live in blobStore (IndexedDB) under the
        // fixed key "company_logo", same "binary bytes never live in the main JSON
        // store" rule every other file this app stores already follows. One company,
        // one logo, reused across every printable report (reports.js's two reports,

        company_logo_filename: "",
        company_logo_mime_type: "",

        // asks for the weighting logic to be configurable and visible, not for each
        // project to carry its own tuning. Must sum to 100; projectHealthEngine.js
        // normalizes defensively if a user edits them into an inconsistent state.
        health_score_weights: {

          cost: 20,
          risk: 20,
          issue: 10,
          rfi: 15,
          change: 10,
        },
        // Gate 16 (Document Control 3: Nomenclature): a single portfolio-wide naming
        // pattern (not per-project) checked against an uploaded document's filename —
        // matches how health_score_weights above is one shared config, not per-project
        // tuning. Tokens (PROJECT/DISCIPLINE/DOCUMENTTYPE/NUMBER/REV) are substituted by
        // documentNomenclatureEngine.js; any other characters in the pattern (separators
        // like "-") pass through unchanged, so a user can adopt any separator/order they
        // want without a schema change. Warn-only, never enforced — see documents.js.
        document_nomenclature_pattern: "PROJECT-DISCIPLINE-DOCUMENTTYPE-NUMBER-REV",

        last_used_names: {},
        // Daily-Use Audit Phase 5 (pinned projects): "someone bouncing between a few

        // active_project_id above only ever remembers ONE project. An ordered array
        // (not a Set — order is meaningful, pin order is display order), project ids

        company_context_memory: {},

        sync_mirror_enabled: false,
        sync_mirror_folder_path: "",

      companies: [],
      clients: [],
      projects: [],
      documents: [],
      risks: [],
      daily_logs: [],
      meetings: [],
      rfis: [],
      change_orders: [],
      // PCC Evolution Roadmap, Tier C: Decision Register. Same project-scoped register
      // shape as risks/rfis/change_orders above — see newDecision() below.
      decisions: [],
      // Gate 1 (Schedule/WBS/Activity data model): storage only — no import parser and

      // gates only have to populate/calculate fields, never migrate the schema again just
      // to add them.
      schedules: [],
      wbs_items: [],
      activities: [],
      relationships: [],

      calendars: [],

      schedule_baselines: [],

      // recovery actions need to persist regardless of which baseline is currently open).
      recovery_actions: [],
      // PCC Evolution Roadmap, Tier F: Advanced Delay Analysis (Gate 23). One row per

      // why this is deliberately a separate register from recovery_actions above.
      delay_records: [],
      // Planning & Scheduling-Centric Delay Management, Gate A/B: the many-to-many

      delay_activity_links: [],
      // PCC Evolution Roadmap, Tier F: Advanced Schedule Performance (Gate 25). One row

      // performance score) — see newSchedulePerformanceSnapshot() below for why this is
      // its own capture mechanism rather than piggybacking on Weekly Reviews.
      schedule_performance_snapshots: [],
      // PCC Evolution Roadmap, Tier 3 (deferred since the original locked build order,

      lessons_learned: [],
      // PCC Evolution Roadmap, Tier 3: Knowledge Base. Portfolio-wide, optional
      // project_id — see newKnowledgeBaseArticle() below for the field design.
      knowledge_base_articles: [],
      // PCC Evolution Roadmap, Tier 3 ("final polish"): Report Template System. Named,
      // saved section-selections for reports.js's two reports and Executive Center's
      // Management Pack — see newReportTemplate() below for the field design.
      report_templates: [],
      // Gate 5b (Tier 2 Cost Tracking): budget line items and the actual-cost log
      // against them. Deliberately two separate arrays, not one shape distinguished by
      // a type field \u2014 unlike Risk/Issue/Opportunity or RFI/TQ, a budget line item and

      cost_budget_items: [],
      cost_actuals: [],

      weekly_reviews: [],

      resources: [],

      packages: [],
      commitments: [],

  function newProjectId() {
    return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function newCompanyId() {
    return "co_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function newClientId() {
    return "cl_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  /** A Company is an independent master-data record — the entity a project is executed
   * for/through (e.g. "FABS", "ABC Engineering"). Archiving (not deleting) is the only
   * retirement path, same "never lose history" rule every other register in this app
   * follows — see CLAUDE.md's Company/Client/Project Management spec, point 14. */
  function newCompany(overrides) {
    var now = new Date().toISOString();
    var base = {
      id: newCompanyId(),
      name: "",
      notes: "",
      archived: false,
      created_at: now,
      updated_at: now,
    };
    return Object.assign(base, overrides || {});

  /** A Client is exclusive to exactly one Company (`company_id`) — per the spec, the same

  function newClient(overrides) {
    var now = new Date().toISOString();
    var base = {
      id: newClientId(),
      company_id: "",
      name: "",
      notes: "",
      archived: false,
      created_at: now,

  function newProject(overrides) {

    var base = {
      id: newProjectId(),
      name: "",
      // Gate 16 (Document Control 3: Nomenclature): a short code (e.g. "ABC") used as

      relationship_history: [],
      client: "",
      company: "",
      country: "",
      location: "",
      sector: "",
      contract_type: "",
      // Gate 9: "Project Type" on the Executive Center's Overview — distinct from

      project_type: "",
      // Gate 9: free-text label for the Executive Center's Overview (e.g. "Design,"

      current_phase: "",

      start_date: "",
      finish_date: "",

      progress: 0,
      project_manager: "",
      planner: "",
      engineers: "",
      contractor: "",
      consultant: "",
      owner: "",
      archived: false,
      attachments: [],
